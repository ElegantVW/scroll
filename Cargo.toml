[package]
name = "scroll-rs"
version = "1.2.0"
edition = "2021"
description = "Standalone Rust TUI encyclopedia and PATH launcher for faeOS"
license = "MIT"

[workspace]

[[bin]]
name = "scroll-rs"
path = "src/main.rs"

[dependencies]
crossterm = "0.28.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
unicode-width = "0.2"
